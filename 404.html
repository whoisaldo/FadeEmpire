<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page not found · Fade Empire</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0A0908">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,500;1,9..144,700;1,9..144,900&family=JetBrains+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap">

  <!-- A barber's link (/larry): the copy stays hidden while it is checked,
       then the page moves on to the booking form or shows itself. The
       animation shows it anyway if the check never runs. -->
  <script>if (/^\/([a-z0-9-]{2,30})\/?$/i.test(location.pathname)) document.documentElement.classList.add('nf-checking');</script>
  <script type="module">
    import { resolvePrettyLink } from '/scripts/pretty-link.js?v=20261021-1';
    const root = document.documentElement;
    if (root.classList.contains('nf-checking')) {
      resolvePrettyLink(location).then(
        (url) => { if (url) location.replace(url); else root.classList.remove('nf-checking'); },
        () => root.classList.remove('nf-checking'),
      );
    }
  </script>

  <link rel="stylesheet" href="/styles/tokens.css?v=20261021-1">
  <link rel="stylesheet" href="/styles/type.css?v=20261021-1">

  <style>
    /* 404-specific layout — kept self-contained so the page works even if
       the rest of the site's CSS is unreachable. */
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(2rem, 6vw, 5rem) 1.25rem;
      text-align: left;
    }

    .nf {
      width: min(720px, 92vw);
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: clamp(1.25rem, 3vw, 2rem);
    }

    .nf__eyebrow {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--gold);
    }

    .nf__rule {
      flex: 1;
      height: 1px;
      background: var(--rule-gold);
    }

    .nf__title {
      font-size: clamp(3.25rem, 11vw, 6.5rem);
      line-height: 0.92;
      letter-spacing: -0.025em;
    }

    .nf__dek {
      max-width: 38ch;
      font-size: clamp(1.0625rem, 1.6vw, 1.25rem);
      color: var(--bone-soft);
    }

    .nf__actions {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .nf__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.95rem 1.5rem;
      border-radius: 2px;
      font-family: 'General Sans', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.875rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform var(--t-fast) var(--ease-out),
                  background var(--t-fast) var(--ease-out),
                  border-color var(--t-fast) var(--ease-out),
                  color var(--t-fast) var(--ease-out);
      min-height: 52px;
    }

    .nf__btn--gold {
      background: var(--gold);
      color: var(--ink);
      border: 1px solid var(--gold);
    }
    .nf__btn--gold:hover { background: var(--gold-pale); border-color: var(--gold-pale); }

    .nf__btn--ghost {
      background: transparent;
      color: var(--bone);
      border: 1px solid var(--rule-strong);
    }
    .nf__btn--ghost:hover { color: var(--gold); border-color: var(--gold); }

    .nf__btn:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    .nf__foot {
      margin-top: clamp(1.5rem, 3vw, 2.5rem);
      padding-top: 1.5rem;
      border-top: 1px solid var(--rule);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 2rem;
      align-items: baseline;
    }

    .nf__foot .t-meta { color: var(--bone-mute); }
    .nf__foot a { color: var(--bone); }
    .nf__foot a:hover { color: var(--gold); }

    @media (max-width: 600px) {
      .nf__actions .nf__btn { flex: 1 1 auto; }
    }

    .nf-checking .nf { visibility: hidden; animation: nf-show 0s 3.5s forwards; }
    @keyframes nf-show { to { visibility: visible; } }
  </style>
</head>
<body>

<main class="nf">
  <p class="nf__eyebrow t-eyebrow">
    <span>Fade Empire</span>
    <span class="nf__rule" aria-hidden="true"></span>
    <span>404</span>
  </p>

  <h1 class="nf__title t-display">Page not<br>found.</h1>

  <p class="nf__dek t-italic">
    There's no page at that address.
  </p>

  <div class="nf__actions">
    <a class="nf__btn nf__btn--gold" href="/">Home</a>
    <a class="nf__btn nf__btn--ghost" href="/#book">Book a chair</a>
    <a class="nf__btn nf__btn--ghost" href="tel:+14138854440">Call 413·885·4440</a>
  </div>

  <footer class="nf__foot">
    <span class="t-meta">Fade Empire</span>
    <span class="t-mono">1193 Memorial Dr · Chicopee · MA 01020</span>
    <a href="https://www.instagram.com/fade_empire_barbershop/" target="_blank" rel="noopener" class="t-mono">Instagram</a>
  </footer>
</main>

</body>
</html>
