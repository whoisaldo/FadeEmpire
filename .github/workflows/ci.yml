# CI — runs on every push and pull request.
#
# Three independent jobs:
#   client-tests    vitest: pure booking logic + the real booking-form markup
#                   driven under jsdom with the RPC layer mocked.
#   db-tests        boots a REAL Postgres (the same supabase/postgres image the
#                   hosted project runs), applies every migration in
#                   supabase/migrations from scratch, then runs the pgTAP suites
#                   in supabase/tests/: schema + seeds, booking RPC
#                   (hours/races/pricing), group + cancellation flow, the anon
#                   security model, people tracking (0019), the SMS
#                   reminder queries (0020), and the barber app's access
#                   rules, RPCs and booking events (0022). Then
#                   tools/service-role-check.sql: the privileges the Edge
#                   Functions use with the service role key.
#   function-tests  deno test for the send-reminders, staff-admin and
#                   notify-booking-event Edge Functions (fetch stubbed).
#
# Suggested repo setting: make all three jobs required checks on main
# (Settings → Branches → protection rule), so nothing broken can deploy —
# GitHub Pages publishes whatever lands on main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-tests:
    name: Client unit + DOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test tooling
        run: npm ci

      - name: Run vitest suite
        run: npm test

  db-tests:
    name: DB migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.0

      - name: Start local Postgres + apply all migrations from scratch
        run: supabase db start

      - name: Lint database functions (plpgsql_check)
        run: supabase db lint --fail-on error

      - name: Run pgTAP suites (schema, booking, cancellation, security, people, reminders, barber app)
        run: supabase test db

      - name: service_role has every privilege the Edge Functions use
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f tools/service-role-check.sql

  function-tests:
    name: Edge Function tests (Deno)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.7

      - name: Run send-reminders tests
        run: deno test --no-lock supabase/functions/send-reminders/

      - name: Run staff-admin tests
        run: deno test --no-lock supabase/functions/staff-admin/

      - name: Run notify-booking-event tests
        run: deno test --no-lock supabase/functions/notify-booking-event/
